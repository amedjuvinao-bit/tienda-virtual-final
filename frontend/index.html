<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (location.pathname.startsWith('/admin')) {
        document.documentElement.dataset.adminEntry = 'true';
        document.documentElement.dataset.adminContext = location.pathname.startsWith('/admin/login') ? 'login' : 'admin';
        try {
          const rememberedModel = localStorage.getItem('rb_admin_loader_model');
          document.documentElement.dataset.adminLoader = ['halo', 'pulse', 'orbit', 'wave', 'linear'].includes(rememberedModel) ? rememberedModel : 'halo';
        } catch { document.documentElement.dataset.adminLoader = 'halo'; }
        try {
          const color = localStorage.getItem(document.documentElement.dataset.adminContext === 'login' ? 'rb_admin_loader_login_color' : 'rb_admin_loader_panel_color');
          if (/^#[0-9a-f]{6}$/i.test(color || '')) document.documentElement.style.setProperty(document.documentElement.dataset.adminContext === 'login' ? '--rb-loader-login-color' : '--rb-loader-panel-color', color);
        } catch { /* Primer acceso: se usa el color neutro. */ }
        // Adelanta la única consulta de configuración al inicio del documento.
        const configuredApi = '%VITE_API_BASE_URL%';
        const apiBase = configuredApi.startsWith('http://') || configuredApi.startsWith('https://')
          ? configuredApi.replace(/\/+$/, '')
          : ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:5000' : '';
        if (apiBase) {
          window.__adminInitialSettingsPromise = fetch(`${apiBase}/api/site-settings`, {
            headers: { Accept: 'application/json' },
          }).then(async (response) => {
            if (!response.ok) throw new Error(`Error HTTP ${response.status} en /api/site-settings`);
            const settings = await response.json();
            const loginTheme = settings?.loginAdmin?.theme;
            const colors = [
              [settings?.loginAdmin?.customizations?.[loginTheme]?.primary, 'rb_admin_loader_login_color', '--rb-loader-login-color'],
              [settings?.admin?.theme?.primary, 'rb_admin_loader_panel_color', '--rb-loader-panel-color'],
            ];
            for (const [color, key, variable] of colors) {
              if (!/^#[0-9a-f]{6}$/i.test(color || '')) continue;
              document.documentElement.style.setProperty(variable, color);
              try { localStorage.setItem(key, color); } catch { /* El color queda aplicado en esta sesión. */ }
            }
            const model = settings?.admin?.loader?.model;
            if (['halo', 'pulse', 'orbit', 'wave', 'linear'].includes(model)) {
              document.documentElement.dataset.adminLoader = model;
              try { localStorage.setItem('rb_admin_loader_model', model); } catch { /* La elección queda aplicada en esta sesión. */ }
            }
            return settings;
          });
          window.__adminInitialSettingsPromise.catch(() => {});
        }
      }
    </script>
    <style>
      .admin-preload { display: none; }
      html[data-admin-entry="true"] .admin-preload { position: relative; box-sizing: border-box; display: grid; min-height: 100dvh; place-items: center; overflow: hidden; color: var(--rb-loader-panel-color, #506477); font-family: system-ui, sans-serif; }
      html[data-admin-context="login"] .admin-preload { color: var(--rb-loader-login-color, #506477); }
      .admin-preload__skeleton { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .admin-preload__skeleton i { position: absolute; display: block; border-radius: 12px; background: color-mix(in srgb, currentColor 8%, transparent); }
      .admin-preload__skeleton i:nth-child(1) { top: 0; left: 0; right: 0; height: 64px; border-radius: 0; }
      .admin-preload__skeleton i:nth-child(2) { top: 64px; bottom: 0; left: 0; width: min(18%, 200px); border-radius: 0; }
      .admin-preload__skeleton i:nth-child(3) { top: 104px; left: max(23%, 235px); width: min(34%, 270px); height: 23px; }
      .admin-preload__skeleton i:nth-child(4) { top: 170px; left: max(23%, 235px); right: 5%; height: 175px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(1) { top: 9%; left: calc(50% - 65px); right: auto; width: 130px; height: 17px; border-radius: 12px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(2) { top: 23%; bottom: auto; left: calc(50% - 205px); width: min(410px, 90%); height: min(480px, 67vh); border: 1px solid color-mix(in srgb, currentColor 13%, transparent); border-radius: 26px; background: color-mix(in srgb, currentColor 5%, transparent); }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(3) { top: 31%; left: calc(50% - 115px); width: 230px; height: 14px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(4) { top: 62%; left: calc(50% - 125px); right: auto; width: 250px; height: 38px; }
      .admin-preload__content { position: relative; display: grid; justify-items: center; gap: 9px; padding: 20px; text-align: center; }
      .admin-preload__visual { display: grid; width: 56px; height: 42px; place-items: center; }
      .admin-preload__visual > * { display: none; }
      html[data-admin-loader="halo"] .admin-preload__halo { display: block; }
      html[data-admin-loader="pulse"] .admin-preload__pulse,
      html[data-admin-loader="wave"] .admin-preload__wave { display: flex; }
      html[data-admin-loader="orbit"] .admin-preload__orbit,
      html[data-admin-loader="linear"] .admin-preload__linear { display: block; }
      .admin-preload__message { color: inherit; font: 600 12px/1.4 Inter, Manrope, system-ui, sans-serif; letter-spacing: .01em; }
      /* Las cinco figuras comparten geometría y tiempos con AdminLoadingScreen.css. */
      .admin-preload__halo { width: 31px; height: 31px; border: 2px solid currentColor; border-right-color: transparent; border-bottom-color: color-mix(in srgb, currentColor 25%, transparent); border-radius: 50%; animation: adminLoaderSpin 1s linear infinite; }
      .admin-preload__pulse, .admin-preload__wave { align-items: center; justify-content: center; gap: 6px; height: 36px; }
      .admin-preload__pulse i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: adminLoaderPulse 1.1s ease-in-out infinite; }
      .admin-preload__pulse i:nth-child(2) { animation-delay: .16s; }
      .admin-preload__pulse i:nth-child(3) { animation-delay: .32s; }
      .admin-preload__orbit { position: relative; width: 36px; height: 36px; animation: adminLoaderSpin 1.5s linear infinite; }
      .admin-preload__orbit i { position: absolute; top: 1px; left: 14px; width: 8px; height: 8px; border-radius: 50%; background: currentColor; transform-origin: 4px 17px; }
      .admin-preload__orbit i:nth-child(2) { transform: rotate(120deg); opacity: .6; }
      .admin-preload__orbit i:nth-child(3) { transform: rotate(240deg); opacity: .35; }
      .admin-preload__wave { gap: 4px; }
      .admin-preload__wave i { width: 4px; height: 18px; border-radius: 4px; background: currentColor; animation: adminLoaderWave 1s ease-in-out infinite alternate; }
      .admin-preload__wave i:nth-child(2), .admin-preload__wave i:nth-child(4) { animation-delay: .18s; }
      .admin-preload__wave i:nth-child(3) { animation-delay: .36s; }
      .admin-preload__linear { position: relative; width: 53px; height: 3px; overflow: hidden; border-radius: 3px; background: color-mix(in srgb, currentColor 22%, transparent); }
      .admin-preload__linear i { position: absolute; left: 0; width: 42%; height: 100%; border-radius: inherit; background: currentColor; animation: adminLoaderSlide 1.1s ease-in-out infinite alternate; }
      @keyframes adminLoaderSpin { to { transform: rotate(360deg); } }
      @keyframes adminLoaderPulse { 50% { transform: translateY(-4px); opacity: .4; } }
      @keyframes adminLoaderWave { from { transform: scaleY(.45); } to { transform: scaleY(1.3); } }
      @keyframes adminLoaderSlide { to { transform: translateX(135%); } }
      @media (max-width: 570px) { html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(2) { left: 5%; } }
      @media (prefers-reduced-motion: reduce) { .admin-preload__halo, .admin-preload__pulse i, .admin-preload__orbit, .admin-preload__wave i, .admin-preload__linear i { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <title>Tienda Virtual</title>
  </head>
  <body>
    <div id="root"><div class="admin-preload" role="status" aria-label="Preparando tu panel"><div class="admin-preload__skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="admin-preload__content"><div class="admin-preload__visual" aria-hidden="true"><i class="admin-preload__halo"></i><span class="admin-preload__pulse"><i></i><i></i><i></i></span><span class="admin-preload__orbit"><i></i><i></i><i></i></span><span class="admin-preload__wave"><i></i><i></i><i></i><i></i><i></i></span><span class="admin-preload__linear"><i></i></span></div><span class="admin-preload__message">Preparando tu panel…</span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
