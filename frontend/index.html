<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (location.pathname.startsWith('/admin')) {
        document.documentElement.dataset.adminEntry = 'true';
        document.documentElement.dataset.adminContext = location.pathname.startsWith('/admin/login') ? 'login' : 'admin';
        try { document.documentElement.dataset.adminLoader = localStorage.getItem('rb_admin_loader_model') || 'halo'; } catch { document.documentElement.dataset.adminLoader = 'halo'; }
        try {
          const color = localStorage.getItem(document.documentElement.dataset.adminContext === 'login' ? 'rb_admin_loader_login_color' : 'rb_admin_loader_panel_color');
          if (/^#[0-9a-f]{6}$/i.test(color || '')) document.documentElement.style.setProperty('--admin-preload-color', color);
        } catch { /* Primer acceso: se usa el color neutro. */ }
      }
    </script>
    <style>
      .admin-preload { display: none; }
      html[data-admin-entry="true"] .admin-preload { position: relative; box-sizing: border-box; display: grid; min-height: 100dvh; place-items: center; overflow: hidden; color: var(--admin-preload-color, #506477); font-family: system-ui, sans-serif; }
      .admin-preload__skeleton { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .admin-preload__skeleton i { position: absolute; display: block; border-radius: 12px; background: color-mix(in srgb, currentColor 8%, transparent); }
      .admin-preload__skeleton i:nth-child(1) { top: 0; left: 0; right: 0; height: 64px; border-radius: 0; }
      .admin-preload__skeleton i:nth-child(2) { top: 64px; bottom: 0; left: 0; width: min(18%, 200px); border-radius: 0; }
      .admin-preload__skeleton i:nth-child(3) { top: 104px; left: max(23%, 235px); width: min(34%, 270px); height: 23px; }
      .admin-preload__skeleton i:nth-child(4) { top: 170px; left: max(23%, 235px); right: 5%; height: 175px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(1) { top: 9%; left: calc(50% - 65px); right: auto; width: 130px; height: 17px; border-radius: 12px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(2) { top: 23%; bottom: auto; left: calc(50% - 205px); width: min(410px, 90%); height: min(480px, 67vh); border: 1px solid color-mix(in srgb, currentColor 13%, transparent); border-radius: 26px; background: color-mix(in srgb, currentColor 5%, transparent); }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(3) { top: 31%; left: calc(50% - 115px); width: 230px; height: 14px; }
      html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(4) { top: 62%; left: calc(50% - 125px); right: auto; width: 250px; height: 38px; }
      .admin-preload__content { position: relative; display: grid; justify-items: center; gap: 10px; padding: 20px; text-align: center; }
      .admin-preload__visual { display: grid; width: 56px; height: 42px; place-items: center; }
      .admin-preload__indicator { width: 31px; height: 31px; border: 2px solid currentColor; border-right-color: transparent; border-bottom-color: color-mix(in srgb, currentColor 25%, transparent); border-radius: 50%; animation: adminPreloadSpin 1s linear infinite; }
      .admin-preload__message { color: inherit; font-size: 12px; font-weight: 600; }
      html[data-admin-loader="pulse"] .admin-preload__indicator { width: 7px; height: 7px; border: 0; background: currentColor; box-shadow: -13px 0 currentColor, 13px 0 currentColor; animation: adminPreloadPulse 1.1s ease-in-out infinite; }
      html[data-admin-loader="orbit"] .admin-preload__indicator { width: 34px; height: 34px; border: 0; background: radial-gradient(circle at 50% 4px,currentColor 4px,transparent 5px),radial-gradient(circle at 87% 28px,currentColor 4px,transparent 5px),radial-gradient(circle at 13% 28px,currentColor 4px,transparent 5px); animation-duration: 1.5s; }
      html[data-admin-loader="wave"] .admin-preload__indicator { width: 4px; height: 20px; border: 0; border-radius: 4px; background: currentColor; box-shadow: -16px 0 currentColor, -8px 0 currentColor, 8px 0 currentColor, 16px 0 currentColor; animation: adminPreloadPulse 1s ease-in-out infinite; }
      html[data-admin-loader="linear"] .admin-preload__indicator { width: 53px; height: 3px; border: 0; border-radius: 3px; background: linear-gradient(90deg,currentColor 0 42%,transparent 42%); animation: adminPreloadPulse 1.1s ease-in-out infinite; }
      @keyframes adminPreloadSpin { to { transform: rotate(360deg); } }
      @keyframes adminPreloadPulse { 50% { opacity: .45; } }
      @media (max-width: 570px) { html[data-admin-context="login"] .admin-preload__skeleton i:nth-child(2) { left: 5%; } }
      @media (prefers-reduced-motion: reduce) { .admin-preload__indicator { animation: none !important; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <title>Tienda Virtual</title>
  </head>
  <body>
    <div id="root"><div class="admin-preload" role="status" aria-label="Preparando tu panel"><div class="admin-preload__skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="admin-preload__content"><div class="admin-preload__visual" aria-hidden="true"><i class="admin-preload__indicator"></i></div><span class="admin-preload__message">Preparando tu panel…</span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
