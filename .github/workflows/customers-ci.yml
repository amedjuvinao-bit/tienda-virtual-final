name: Clientes CI

on:
  push:
    branches:
      - main
      - feature/clientes-nivel-plus-etapa-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientes-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customers-integrity:
    name: Integridad y seguridad de Clientes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Validar seguridad, identidad y contratos
        run: npm --prefix backend run test:customers-stage1

      - name: Validar migración de datos e índices
        run: npm --prefix backend run test:customer-integrity-migration

      - name: Conservar conexión con Órdenes
        run: npm --prefix backend run test:orders-customer-connection

      - name: Instalar frontend
        run: npm --prefix frontend ci

      - name: Validar paginación y datos fiscales
        run: npm --prefix frontend run test:customers-module

      - name: Compilar frontend
        run: npm --prefix frontend run build

  customers-mongodb:
    name: Concurrencia real de identidad
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Validar escrituras simultáneas e índices físicos
        env:
          CUSTOMERS_TEST_MONGO_URI: mongodb://127.0.0.1:27017/customers_ci
        run: npm --prefix backend run test:customer-identity-concurrency
