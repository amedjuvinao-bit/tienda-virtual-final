name: Páginas - interfaz y borradores
on:
  push:
    branches: [feature/paginas-nivel-plus]
  pull_request:
    branches: [main, feature/paginas-nivel-plus]
  workflow_dispatch:
jobs:
  pages-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:pages-module
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e:pages-module
        working-directory: frontend
        env:
          PAGES_E2E_ARTIFACTS: ${{ runner.temp }}/pages-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-editor-browser
          path: ${{ runner.temp }}/pages-e2e
      - run: npm run build
        working-directory: frontend
      - name: Verificar la entrada independiente de vista previa
        run: test -f frontend/dist/page-preview.html
      - run: node .github/scripts/audit-production-dependencies.cjs frontend
