name: Facturacion CI

on:
  push:
    branches:
      - main
      - feature/facturacion-comprobantes
  pull_request:
    branches:
      - main
      - feature/facturacion-comprobantes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facturacion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Seguridad de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Auditar backend
        run: node .github/scripts/audit-production-dependencies.cjs backend

      - name: Instalar frontend
        run: npm --prefix frontend ci

      - name: Auditar frontend
        run: node .github/scripts/audit-production-dependencies.cjs frontend

  billing-module:
    name: Motor de facturacion
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend y frontend
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Validar almacenamiento Cloudinary
        run: npm --prefix backend run test:cloudinary-storage

      - name: Validar resiliencia estricta
        run: npm --prefix backend run test:billing-resilience:strict

      - name: Validar cierre integral
        run: npm --prefix backend run test:billing-module

  billing-ui:
    name: Interfaz de facturacion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar frontend
        run: npm --prefix frontend ci

      - name: Probar configuracion visual
        run: npm --prefix frontend run test:billing-configuration-ui

      - name: Compilar frontend
        run: npm --prefix frontend run build

  billing-stress:
    name: Prueba de choque
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Validar plan de choque
        run: npm --prefix backend run test:billing-stress -- --validate-plan

      - name: Ejecutar choque e integridad
        env:
          BILLING_STRESS_MONGO_URI: mongodb://127.0.0.1:27017
          BILLING_STRESS_MAX_DURATION_MS: 180000
        run: npm --prefix backend run test:billing-stress
