name: Finanzas CI

on:
  push:
    branches:
      - main
      - feature/finanzas-nivel-plus-etapa-0
      - feature/finanzas-nivel-plus-etapa-1
      - feature/finanzas-nivel-plus-etapa-2
      - feature/finanzas-nivel-plus-etapa-3
      - feature/finanzas-nivel-plus-etapa-4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-integrity:
    name: Integridad y seguridad de Finanzas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Validar seguridad y exactitud de Etapa 0
        run: npm --prefix backend run test:finance-level-plus-stage0

      - name: Validar gobierno de gastos de Etapa 1
        run: npm --prefix backend run test:finance-level-plus-stage1

      - name: Validar presupuestos y centros de costo de Etapa 2
        run: npm --prefix backend run test:finance-level-plus-stage2

      - name: Validar cartera y tesorería de Etapa 3
        run: npm --prefix backend run test:finance-level-plus-stage3

      - name: Validar conciliación y cierre de Etapa 4
        run: npm --prefix backend run test:finance-level-plus-stage4

      - name: Revisar migración aditiva de gastos
        run: npm --prefix backend run migrate:finance-expense-indexes

      - name: Revisar migración aditiva de presupuestos
        run: npm --prefix backend run migrate:finance-budget-indexes

      - name: Revisar migración aditiva de tesorería
        run: npm --prefix backend run migrate:finance-treasury-indexes

      - name: Revisar migración aditiva de cierres
        run: npm --prefix backend run migrate:finance-period-close-indexes

      - name: Instalar frontend
        run: npm --prefix frontend ci

      - name: Validar presentación financiera de Etapa 0
        run: npm --prefix frontend run test:finance-level-plus-stage0

      - name: Validar solicitudes y aprobaciones de Etapa 1
        run: npm --prefix frontend run test:finance-level-plus-stage1

      - name: Validar control presupuestal de Etapa 2
        run: npm --prefix frontend run test:finance-level-plus-stage2

      - name: Validar cartera y abonos de Etapa 3
        run: npm --prefix frontend run test:finance-level-plus-stage3

      - name: Validar panel de conciliación y cierre de Etapa 4
        run: npm --prefix frontend run test:finance-level-plus-stage4

      - name: Compilar frontend
        run: npm --prefix frontend run build

  finance-mongodb:
    name: Hechos financieros reales en MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend
        run: npm --prefix backend ci

      - name: Validar sedes, devoluciones, notas crédito y costos históricos
        env:
          FINANCE_STAGE0_MONGO_URI: mongodb://127.0.0.1:27017/finance_stage0_ci
        run: npm --prefix backend run test:finance-level-plus-stage0-integration

      - name: Aplicar índices financieros en la base aislada
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/finance_stage1_ci
        run: npm --prefix backend run migrate:finance-expense-indexes -- --apply-finance-expense-index-migration

      - name: Validar solicitudes, decisiones y concurrencia de gastos
        env:
          FINANCE_STAGE1_MONGO_URI: mongodb://127.0.0.1:27017/finance_stage1_ci
        run: npm --prefix backend run test:finance-level-plus-stage1-integration

      - name: Aplicar índices presupuestales en la base aislada
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/finance_stage2_ci
        run: npm --prefix backend run migrate:finance-budget-indexes -- --apply-finance-budget-index-migration

      - name: Validar límites, excepciones y concurrencia presupuestal
        env:
          FINANCE_STAGE2_MONGO_URI: mongodb://127.0.0.1:27017/finance_stage2_ci
        run: npm --prefix backend run test:finance-level-plus-stage2-integration

      - name: Aplicar índices de tesorería en la base aislada
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/finance_stage3_ci
        run: npm --prefix backend run migrate:finance-treasury-indexes -- --apply-finance-treasury-index-migration

      - name: Validar cartera, abonos y concurrencia de tesorería
        env:
          FINANCE_STAGE3_MONGO_URI: mongodb://127.0.0.1:27017/finance_stage3_ci
        run: npm --prefix backend run test:finance-level-plus-stage3-integration

      - name: Aplicar índices de cierres en la base aislada
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/finance_stage4_ci
        run: npm --prefix backend run migrate:finance-period-close-indexes -- --apply-finance-period-close-index-migration

      - name: Validar cierres, huellas, idempotencia y concurrencia
        env:
          FINANCE_STAGE4_MONGO_URI: mongodb://127.0.0.1:27017/finance_stage4_ci
        run: npm --prefix backend run test:finance-level-plus-stage4-integration
