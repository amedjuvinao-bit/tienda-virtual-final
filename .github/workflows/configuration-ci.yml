name: Configuracion CI

on:
  push:
    branches:
      - main
      - 'feature/configuracion-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configuracion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration-integrity:
    name: Integridad de Configuracion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar backend y frontend
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Auditar dependencias de produccion
        run: |
          node .github/scripts/audit-production-dependencies.cjs backend
          node .github/scripts/audit-production-dependencies.cjs frontend

      - name: Validar permisos, Logs, entorno, CORS y Tienda
        run: |
          npm --prefix backend run test:configuration-level-plus-stage0
          npm --prefix backend run test:configuration-level-plus-stage1
          npm --prefix backend run test:configuration-level-plus-stage2

      - name: Validar configuracion de pagos y envios
        run: |
          npm --prefix backend run test:payment-configuration-authority
          npm --prefix backend run test:payment-route-composition
          npm --prefix backend run test:configuration-level-plus-stage3
          npm --prefix backend run test:shipping-providers
          npm --prefix backend run test:shipping-settings
          npm --prefix backend run test:order-shipping-composition

      - name: Validar configuracion de correo y login administrativo
        run: |
          npm --prefix backend run test:configuration-level-plus-stage4
          npm --prefix backend run test:configuration-level-plus-stage5
          npm --prefix backend run test:admin-users-stage1

      - name: Validar interfaz de Configuracion
        run: |
          npm --prefix frontend run test:configuration-level-plus-stage0
          npm --prefix frontend run test:configuration-level-plus-stage1
          npm --prefix frontend run test:configuration-level-plus-stage2
          npm --prefix frontend run test:configuration-level-plus-stage3
          npm --prefix frontend run test:configuration-level-plus-stage4
          npm --prefix frontend run test:configuration-level-plus-stage5
          npm --prefix frontend run test:admin-users-stage1

      - name: Compilar frontend
        run: npm --prefix frontend run build
