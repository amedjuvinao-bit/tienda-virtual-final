# Candidate configuration. Review Render's charges before creating services.
# Do not narrow rootDir: both applications import the repository's shared/.
services:
  - type: web
    name: rosa-boutique-api
    runtime: docker
    branch: main
    region: virginia
    plan: starter
    numInstances: 1
    dockerfilePath: ./deploy/backend.Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    disk:
      name: tienda-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: BACKUP_DIRECTORY
        value: /var/data/backups
      - key: BACKUP_PANEL_SINGLE_INSTANCE
        # Operational confirmation, managed in Render after checking all writers.
        # Blueprint syncs must not reset a previously confirmed value.
        sync: false
      - key: ADMIN_2FA_REQUIRED_ROLES
        value: owner,admin
      - key: SELECTION_RETENTION_ENABLED
        value: 'true'
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: rosa-boutique-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromService:
          name: rosa-boutique-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_COOKIE_SAME_SITE
        sync: false
      # Supply the existing values when migrating encrypted settings/2FA.
      # Do not generate replacements for an existing database.
      - key: JWT_SECRET
        sync: false
      - key: CART_ACCESS_SECRET
        sync: false
      - key: ORDER_PAYMENT_ACCESS_SECRET
        sync: false
      - key: ORDER_RETURN_ACCESS_SECRET
        sync: false
      - key: BILLING_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATIONS_ENCRYPTION_KEY
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_2FA_ENCRYPTION_KEY
        sync: false
      - key: INSTAGRAM_ENCRYPTION_KEY
        sync: false
      - key: CUSTOMER_AUDIT_HASH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BACKUP_DB_NAME
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: STAGING_MONGODB_URI
        sync: false

  - type: web
    name: rosa-boutique-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm --prefix frontend ci && node deploy/build-frontend.mjs
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_BASE_URL
        # Browser requests stay first-party, including Safari session cookies.
        fromService:
          name: rosa-boutique-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /api/*
        name: Cache-Control
        value: private, no-store
    routes:
      # These public upstream URLs belong to the existing production API.
      # Keep proxy rules before the SPA fallback; do not turn them into redirects.
      - type: rewrite
        source: /api/*
        destination: https://rosa-boutique-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://rosa-boutique-api.onrender.com/uploads/*
      - type: redirect
        source: /legal/privacidad.html
        destination: /privacidad
      - type: redirect
        source: /legal/terminos.html
        destination: /terminos
      - type: redirect
        source: /legal
        destination: /privacidad
      - type: redirect
        source: /legal/*
        destination: /privacidad
      - type: rewrite
        source: /*
        destination: /index.html
